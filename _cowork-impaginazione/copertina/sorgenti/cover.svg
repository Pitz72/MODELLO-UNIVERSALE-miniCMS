<text x="13.18" y="40.00" font-family="IBM Plex Mono" font-size="2.70" font-weight="500" font-style="normal" fill="#2DD4BF" fill-opacity="1" text-anchor="start" letter-spacing="2.5">IL PROTOCOLLO MINICMS</text>
<text x="13.18" y="58.00" font-family="IBM Plex Serif" font-size="3.40" font-weight="400" font-style="normal" fill="#cdd9e6" fill-opacity="1" text-anchor="start">Il frontend è diventato magnifico. Ma sotto ci</text>
<text x="13.18" y="63.00" font-family="IBM Plex Serif" font-size="3.40" font-weight="400" font-style="normal" fill="#cdd9e6" fill-opacity="1" text-anchor="start">mettiamo troppo: Node, container, CMS in</text>
<text x="13.18" y="68.00" font-family="IBM Plex Serif" font-size="3.40" font-weight="400" font-style="normal" fill="#cdd9e6" fill-opacity="1" text-anchor="start">abbonamento, servizi cloud, per siti che</text>
<text x="13.18" y="73.00" font-family="IBM Plex Serif" font-size="3.40" font-weight="400" font-style="normal" fill="#cdd9e6" fill-opacity="1" text-anchor="start">girerebbero benissimo su un hosting da pochi euro.</text>
<text x="13.18" y="81.00" font-family="IBM Plex Serif" font-size="3.40" font-weight="400" font-style="normal" fill="#cdd9e6" fill-opacity="1" text-anchor="start">«The Thin Stack» è il protocollo che separa due</text>
<text x="13.18" y="86.00" font-family="IBM Plex Serif" font-size="3.40" font-weight="400" font-style="normal" fill="#cdd9e6" fill-opacity="1" text-anchor="start">piani: la presentazione a React e TypeScript, i dati</text>
<text x="13.18" y="91.00" font-family="IBM Plex Serif" font-size="3.40" font-weight="400" font-style="normal" fill="#cdd9e6" fill-opacity="1" text-anchor="start">a PHP nativo e SQLite (o MySQL quando serve).</text>
<text x="13.18" y="96.00" font-family="IBM Plex Serif" font-size="3.40" font-weight="400" font-style="normal" fill="#cdd9e6" fill-opacity="1" text-anchor="start">Niente framework di backend, niente overhead: uno</text>
<text x="13.18" y="101.00" font-family="IBM Plex Serif" font-size="3.40" font-weight="400" font-style="normal" fill="#cdd9e6" fill-opacity="1" text-anchor="start">scheletro minimo ma vero, che scala su tre gradini</text>
<text x="13.18" y="106.00" font-family="IBM Plex Serif" font-size="3.40" font-weight="400" font-style="normal" fill="#cdd9e6" fill-opacity="1" text-anchor="start">a seconda di ciò che ti serve.</text>
<text x="13.18" y="114.00" font-family="IBM Plex Serif" font-size="3.40" font-weight="400" font-style="normal" fill="#cdd9e6" fill-opacity="1" text-anchor="start">Venti capitoli e tre appendici costruiti su quattro</text>
<text x="13.18" y="119.00" font-family="IBM Plex Serif" font-size="3.40" font-weight="400" font-style="normal" fill="#cdd9e6" fill-opacity="1" text-anchor="start">siti reali in produzione: sicurezza fatta a mano, SEO</text>
<text x="13.18" y="124.00" font-family="IBM Plex Serif" font-size="3.40" font-weight="400" font-style="normal" fill="#cdd9e6" fill-opacity="1" text-anchor="start">che funziona, feed, newsletter, dashboard, e tutte</text>
<text x="13.18" y="129.00" font-family="IBM Plex Serif" font-size="3.40" font-weight="400" font-style="normal" fill="#cdd9e6" fill-opacity="1" text-anchor="start">le cicatrici di chi l'ha messo online sul serio.</text>
<text x="13.18" y="247.18" font-family="IBM Plex Mono" font-size="3.00" font-weight="500" font-style="normal" fill="#eef3f8" fill-opacity="1" text-anchor="start" letter-spacing="2.0">RUNTIME EDIZIONI</text>
<text x="13.18" y="252.18" font-family="IBM Plex Mono" font-size="2.60" font-weight="400" font-style="normal" fill="#9fb3c8" fill-opacity="1" text-anchor="start">www.runtimeradio.com</text>
