<text x="70" y="1.0" font-family="IBM Plex Serif" font-size="3.0" font-weight="600" fill="#eef3f8" text-anchor="start" dominant-baseline="middle">Simone Pizzi&#160;&#160;·&#160;&#160;The Thin Stack</text>
